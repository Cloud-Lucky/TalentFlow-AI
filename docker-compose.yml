services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: talentflow
      POSTGRES_USER: talentflow
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-only-password}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U talentflow -d talentflow"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  api:
    build: ./backend
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://talentflow:${POSTGRES_PASSWORD:-local-only-password}@db:5432/talentflow
      CORS_ORIGINS: http://localhost:8080,http://127.0.0.1:8080
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
  frontend:
    image: nginx:1.27-alpine
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports: ["8080:80"]
    depends_on: [api]
    restart: unless-stopped
volumes:
  pgdata:
