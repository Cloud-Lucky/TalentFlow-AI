apiVersion: apps/v1
kind: Deployment
metadata:
  name: talentflow-api
  namespace: talentflow
spec:
  replicas: 2
  selector:
    matchLabels:
      app: talentflow-api
  template:
    metadata:
      labels:
        app: talentflow-api
    spec:
      containers:
        - name: api
          image: 488519936337.dkr.ecr.us-east-1.amazonaws.com/talentflow-api:v1
          imagePullPolicy: Always
          ports:
            - containerPort: 5000
          envFrom:
            - secretRef:
                name: talentflow-app-secrets
          env:
            - name: AUTO_CREATE_TABLES
              value: "false"
          readinessProbe:
            httpGet:
              path: /api/health/ready
              port: 5000
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 5000
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: talentflow
spec:
  type: ClusterIP
  selector:
    app: talentflow-api
  ports:
    - name: http
      port: 5000
      targetPort: 5000

